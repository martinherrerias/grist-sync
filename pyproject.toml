[project]
name = "grist-sync"
version = "0.1.3"
description = "Synchronize Grist formulas with version-controlled source files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grist-api>=0.1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
gr = "grist_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.uv]
package = true
